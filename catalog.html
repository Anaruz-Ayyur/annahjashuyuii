<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>النهج الشيوعي</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header id="masthead" class="masthead"></header>

  <main>
    <div id="catalog"></div>
  </main>

  <script>
    renderMasthead("catalog");

    (async function () {
      const container = document.getElementById("catalog");
      const issues = await fetchIssues();
      if (issues.length === 0) {
        return;
      }
      const grouped = groupIssuesByYearMonth(issues);
      container.innerHTML = grouped.map((y) => `
        <details class="archive-year">
          <summary class="archive-year__summary">${y.year}</summary>
          ${y.months.map((m) => `
            <details class="archive-month">
              <summary class="archive-month__summary">${m.month}</summary>
              <div class="issue-grid">${m.issues.map(plateHtml).join("")}</div>
            </details>
          `).join("")}
        </details>
      `).join("");
    })();
  </script>
</body>
</html>
